<body>
    <header>
    <!-- Navbar -->

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Setlhoa Apartments
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

    <!-- Apartment Details -->
    <main class="container">

        <div class="row">

            <!-- Image -->
            <section class="apartment-gallery" aria-label="Apartment image gallery">

    <figure>
        <img id="main-image"
             src="images/apartment1.jpg"
             alt="Living room of 1 Bedroom Apartment">

        <figcaption id="image-caption">
            Living Room
        </figcaption>
    </figure>

    <nav class="gallery-controls" aria-label="Gallery controls">
        <button type="button" onclick="previousImage()">
            Previous
        </button>

        <button type="button" onclick="nextImage()">
            Next
        </button>
    </nav>

</section>

            <!-- Details -->
            <section class="col-md-6">

                <h1 id="apartment-title"></h1>

                <p class="lead" id="apartment-price"></p>

                <p id="apartment-description"></p>

                <h4>Features</h4>

                <ul id="features-list"></ul>

                <a href="Bookings.html"
                   class="btn btn-primary mt-3">
                    Book Now
                </a>

            </section>

        </div>

    </main>

  
    
    
    
    <!-- JavaScript -->
    <script>
    const images = [
    {
        src: "images/apartment22.jpg",
        alt: "Living room",
        caption: "Living room"
    },
    
    {
        src: "images/balcony.jpeg",
        alt: "Balcony",
        caption: "Balcony"
    },
    {
        src: "images/bedroom2.jpg",
        alt: "Bedroom",
        caption: " Master Bedroom"
    },
    {
        src: "images/bedroom3.jpg",
        alt: "bedroom",
        caption: "Bedroom"
    },
        {
        src: "images/kitchen.jpeg",
        alt: "Kitchen",
        caption: "Kitchen"
    },
        {
        src: "images/bathroom.jpeg",
        alt: "Bathroom",
        caption: "Bathroom"
    }
];

let currentImage = 0;

const mainImage = document.getElementById("main-image");
const imageCaption = document.getElementById("image-caption");

function showImage(index) {
    mainImage.src = images[index].src;
    mainImage.alt = images[index].alt;
    imageCaption.textContent = images[index].caption;
}

function nextImage() {
    currentImage++;

    if (currentImage >= images.length) {
        currentImage = 0;
    }

    showImage(currentImage);
}

function previousImage() {
    currentImage--;

    if (currentImage < 0) {
        currentImage = images.length - 1;
    }

    showImage(currentImage);
}
  
        
        // Apartment Data
        const apartment = {

            title: "2 Bedroom Apartment",

            price: "P4000/month",

            image: "images/apartment1.jpg",

            description:
                "Modern 2 bedroom apartment located near schools, shopping centers, and transport routes with 2 parking spots allocated.",

            features: [
                "Free Wi-Fi",
                "Private Bathroom",
                "Kitchen",
                "Parking Space",
                "24/7 Security"
            ]
        };

        // Insert Data Into HTML
        document.getElementById("apartment-title").textContent =
            apartment.title;

        document.getElementById("apartment-price").textContent =
            apartment.price;

        document.getElementById("apartment-description").textContent =
            apartment.description;



        // Features List
        const featuresList =
            document.getElementById("features-list");

        apartment.features.forEach(feature => {

            const li = document.createElement("li");

            li.textContent = feature;

            featuresList.appendChild(li);

        });

    </script>

    

</body>
</html>
