<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apartment Details</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Setlhoa Apartments
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="listings.html">
                            Listings
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="Bookings.html">
                            Booking
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Apartment Details -->
    <main class="container my-5">

        <div class="row">

            <!-- Image -->
           <section class="apartment-gallery" aria-label="Apartment image gallery">

    <figure>
        <img id="main-image"
             src="images/apartment1.jpg"
             alt="Living room of 1 Bedroom Apartment">

        <figcaption id="image-caption">
            Living Room
        </figcaption>
    </figure>

    <nav class="gallery-controls" aria-label="Gallery controls">
        <button type="button" onclick="previousImage()">
            Previous
        </button>

        <button type="button" onclick="nextImage()">
            Next
        </button>
    </nav>

</section>

            <!-- Details -->
            <section class="col-md-6">

                <h1 id="apartment-title"></h1>

                <p class="lead" id="apartment-price"></p>

                <p id="apartment-description"></p>

                <h4>Features</h4>

                <ul id="features-list"></ul>

                <a href="Bookings.html"
                   class="btn btn-primary mt-3">
                    Book Now
                </a>

            </section>

        </div>

    </main>

    <!-- JavaScript -->
    <script>

        // Apartment Data
        const apartment = {

            title: " Family Apartment",

            price: "7000/month",

            image: "images/apartment1.jpg",

            description:
                "Modern 1 bedroom apartment located near schools, shopping centers, and transport routes.",

            features: [
                "Free Wi-Fi",
                "Private Bathroom",
                "Kitchen",
                "Parking Space",
                "24/7 Security"
            ]
        };

        // Insert Data Into HTML
        document.getElementById("apartment-title").textContent =
            apartment.title;

        document.getElementById("apartment-price").textContent =
            apartment.price;

        document.getElementById("apartment-description").textContent =
            apartment.description;

        document.getElementById("apartment-image").src =
            apartment.image;

        // Features List
        const featuresList =
            document.getElementById("features-list");

        apartment.features.forEach(feature => {

            const li = document.createElement("li");

            li.textContent = feature;

            featuresList.appendChild(li);

        });

    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
