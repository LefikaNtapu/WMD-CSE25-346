<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book an Apartment | Setlhoa Apartments</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- Navbar -->
    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <div class="container">

                <a class="navbar-brand" href="index.html">Setlhoa Bookings</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="listings.html">Listings</a>
                        </li>
                        <li class="nav-item">

                            <a class="nav-link" href="about.html">About</a>

                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="booking.html">Booking</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>

                    </ul>

                </section>

            </section>

        </nav>

    </header>

    <!-- Booking Form -->
    <main class="container my-5">

        <section class="card shadow p-4">

            <h1 class="text-center mb-4">
                Apartment Booking Form
            </h1>

            <form>

                <!-- Full Name -->
                <section class="mb-3">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input 
                        type="text"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >

                </section>

                <!-- Email -->
                <section class="mb-3">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input 
                        type="email"
                        class="form-control"
                        placeholder="example@email.com"
                        required
                    >

                </section>

                <!-- Phone -->
                <section class="mb-3">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input 
                        type="tel"
                        class="form-control"
                        placeholder="+267"
                        required
                    >

                </section>

                <!-- Apartment Type -->
                <section class="mb-3">

                    <label class="form-label">
                        Apartment Type
                    </label>

                    <select class="form-select">

                        <option selected disabled>
                            Choose Apartment Type
                        </option>

                        <option>
                            Single Room
                        </option>

                        <option>
                            One Bedroom
                        </option>

                        <option>
                            Two Bedroom
                        </option>

                        <option>
                            Family Apartment
                        </option>

                    </select>

                </section>

                <!-- Dates -->
                <section class="row">

                    <article class="col-md-6 mb-3">

                        <label class="form-label">
                            Check-In Date
                        </label>

                        <input 
                            type="date"
                            class="form-control"
                            required
                        >

                    </article>

                    <article class="col-md-6 mb-3">

                        <label class="form-label">
                            Check-Out Date
                        </label>

                        <input 
                            type="date"
                            class="form-control"
                            required
                        >

                    </article>

                </section>

                <!-- Guests -->
                <section class="mb-3">

                    <label class="form-label">
                        Number of Guests
                    </label>

                    <input 
                        type="number"
                        class="form-control"
                        min="1"
                        max="10"
                        required
                    >

                </section>

                <!-- Message -->
                <section class="mb-4">

                    <label class="form-label">
                        Additional Information
                    </label>

                    <textarea 
                        class="form-control"
                        rows="4"
                        placeholder="Special requests..."
                    ></textarea>

                </section>

                <!-- Submit -->
                <button class="btn btn-primary w-100">

                    Confirm Booking

                </button>

            </form>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">

        <p class="mb-0">
            &copy; 2026 Setlhoa Apartments
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
